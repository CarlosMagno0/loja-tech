
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Loja Tech</title>

    <link rel="stylesheet" href="style.css">

    <!-- REACT CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .crud-container {
            margin-top: 3rem;
        }

        .crud-form {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 2rem;

            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .crud-form input,
        .crud-form textarea {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
        }

        .crud-form button {
            background: #00c853;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .crud-form button:hover {
            background: #00a844;
        }

        .crud-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn-edit {
            background: #007bff;
        }

        .btn-delete {
            background: #ff4444;
        }

        .btn-edit,
        .btn-delete {
            border: none;
            padding: 10px 15px;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <div class="topo">
        <img src="img/logo.png" alt="Logo Loja Tech" class="logo">

        <input type="checkbox" id="menu-toggle" class="menu-toggle">

        <label for="menu-toggle" class="menu-label">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <h1>Loja Tech</h1>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">🏠 Início</a></li>
            <li><a href="produtos.html">🖱️ Produtos</a></li>
            <li><a href="carrinho.html">🛒 Carrinho</a></li>
            <li><a href="contato.html">📞 Fale Conosco</a></li>
        </ul>
    </nav>

    <div class="menu-overlay"></div>
</header>

<main>

    <section class="hero">
        <h1>🛒 Produtos</h1>
        <p>Gerencie os produtos da Loja Tech</p>
    </section>

    <!-- REACT APP -->
    <div id="root"></div>

</main>

    <div class="footer-content">

    </div>

<script type="text/babel">

const { useState, useEffect } = React;

function App() {

    const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem("products");
        return saved ? JSON.parse(saved) : [
            {
                id: 1,
                nome: "Mouse Gamer RGB",
                preco: "199.90",
                descricao: "Mouse gamer com RGB"
            },
            {
                id: 2,
                nome: "Teclado Mecânico",
                preco: "349.90",
                descricao: "Teclado mecânico profissional"
            }
        ];
    });

    const [nome, setNome] = useState("");
    const [preco, setPreco] = useState("");
    const [descricao, setDescricao] = useState("");

    const [editingId, setEditingId] = useState(null);

    useEffect(() => {
        localStorage.setItem("products", JSON.stringify(products));
    }, [products]);

    function handleSubmit(e) {
        e.preventDefault();

        if (!nome || !preco || !descricao) {
            return;
        }

        if (editingId) {

            const updated = products.map(product =>
                product.id === editingId
                    ? {
                        ...product,
                        nome,
                        preco,
                        descricao
                    }
                    : product
            );

            setProducts(updated);
            setEditingId(null);

        } else {

            const newProduct = {
                id: Date.now(),
                nome,
                preco,
                descricao
            };

            setProducts([...products, newProduct]);
        }

        setNome("");
        setPreco("");
        setDescricao("");
    }

    function deleteProduct(id) {

        const confirmDelete = confirm(
            "Deseja realmente excluir este produto?"
        );

        if (!confirmDelete) return;

        const updated = products.filter(
            product => product.id !== id
        );

        setProducts(updated);
    }

    function editProduct(product) {
        setNome(product.nome);
        setPreco(product.preco);
        setDescricao(product.descricao);

        setEditingId(product.id);

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }

    return (
        <div className="crud-container">

            <form
                className="crud-form"
                onSubmit={handleSubmit}
            >

                <input
                    type="text"
                    placeholder="Nome do Produto"
                    value={nome}
                    onChange={(e) => setNome(e.target.value)}
                />

                <input
                    type="number"
                    placeholder="Preço"
                    value={preco}
                    onChange={(e) => setPreco(e.target.value)}
                />

                <textarea
                    placeholder="Descrição do produto"
                    rows="4"
                    value={descricao}
                    onChange={(e) => setDescricao(e.target.value)}
                ></textarea>

                <button type="submit">
                    {
                        editingId
                        ? "✏️ Atualizar Produto"
                        : "➕ Cadastrar Produto"
                    }
                </button>

            </form>

            <div className="grid">

                {
                    products.map(product => (

                        <div className="card" key={product.id}>

                            <h3>{product.nome}</h3>

                            <div className="preco">
                                R$ {Number(product.preco).toFixed(2)}
                            </div>

                            <p>{product.descricao}</p>

                            <div className="crud-buttons">

                                <button
                                    className="btn-edit"
                                    onClick={() => editProduct(product)}
                                >
                                    ✏️ Editar
                                </button>

                                <button
                                    className="btn-delete"
                                    onClick={() => deleteProduct(product.id)}
                                >
                                    🗑️ Excluir
                                </button>

                            </div>

                        </div>

                    ))
                }

            </div>

        </div>
    );
}

ReactDOM.createRoot(
    document.getElementById("root")
).render(<App />);

</script>

</body>
</html>
